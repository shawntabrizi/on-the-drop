[package]
name = "on-the-drop-wasm"
description = "WebAssembly binding of on-the-drop for the web app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
# cdylib: the .wasm for wasm-bindgen; rlib: the native parity test calls the
# same functions.
crate-type = ["cdylib", "rlib"]

[dependencies]
on-the-drop = { path = "../on-the-drop" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned exactly: the generated JS glue must match wasm-bindgen-cli
# (.github/workflows/pages.yml installs the same version).
wasm-bindgen = "=0.2.129"

[dev-dependencies]
wasm-bindgen-test = "=0.3.79"
