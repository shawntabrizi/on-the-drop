[package]
name = "on-the-drop"
description = "Beatgrid, phrase and drop analysis (pure Rust core, no Godot dependency)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = true
rust-version.workspace = true
repository = "https://github.com/shawntabrizi/on-the-drop"
readme = "../../README.md"
keywords = ["audio", "music", "beat-tracking", "dj", "analysis"]
categories = ["multimedia::audio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Track fingerprint (track_id.rs). Pinned exactly: a new version may change
# the fingerprint, and saved labels are keyed by it (FINGERPRINT_VERSION).
rusty-chromaprint = "=0.3.0"
