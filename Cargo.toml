[workspace]
resolver = "3"
members = ["crates/on-the-drop", "crates/on-the-drop-godot"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Shawn Tabrizi"]
publish = false
rust-version = "1.94"

[profile.release]
lto = true
codegen-units = 1
strip = true
